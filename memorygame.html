<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Navideño / Grinch</title>
    <style>
        :root {
            --bg-pink: #fff0f5;
            --card-back: #ffb6c1;
            --card-back-hover: #ff91a4;
            --card-front: #ffffff;
            --card-border: #ffe4e1;
            --primary-pink: #ff69b4;
            --dark-pink: #d81b60;
            --text-color: #5c3a44;
            --shadow: 0 8px 20px rgba(255, 105, 180, 0.2);
            --panel-bg: #ffffff;
            --modal-bg: #ffffff;
            --timer-color: #d81b60;
        }

        body.grinch-mode {
            --bg-pink: #0b1410;
            --card-back: #1b4332;
            --card-back-hover: #2d6a4f;
            --card-front: #14221a;
            --card-border: #2d6a4f;
            --primary-pink: #52b788;
            --dark-pink: #74c69d;
            --text-color: #d8f3dc;
            --shadow: 0 8px 20px rgba(82, 183, 136, 0.25);
            --panel-bg: #14221a;
            --modal-bg: #1b2e23;
            --timer-color: #52b788;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-pink);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }

        .side-panel {
            background: var(--panel-bg);
            padding: 20px 15px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 170px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .side-panel h3 {
            font-size: 1rem;
            color: var(--dark-pink);
            margin-bottom: 5px;
        }

        .center-container {
            flex: 1;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }

        header {
            margin-bottom: 15px;
        }

        h1 {
            color: var(--dark-pink);
            font-size: 2rem;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 10px 18px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            font-size: 1rem;
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-action:hover {
            background-color: var(--dark-pink);
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        /* Slider vertical o compacto */
        .difficulty-slider-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .difficulty-slider-container input[type="range"] {
            accent-color: var(--primary-pink);
            cursor: pointer;
            width: 100%;
        }

        .difficulty-badge {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 8px;
            background: rgba(255, 105, 180, 0.1);
            border-radius: 8px;
        }

        /* Temporizador estilo cute */
        .timer-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--timer-color);
            background: rgba(0,0,0,0.03);
            padding: 10px;
            border-radius: 12px;
            width: 100%;
            letter-spacing: 1px;
        }

        .timer-icon {
            font-size: 1.5rem;
            margin-bottom: 2px;
        }

        .board {
            display: grid;
            gap: 10px;
            perspective: 1000px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .card {
            aspect-ratio: 1;
            background-color: transparent;
            border: none;
            cursor: pointer;
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s;
            transform-style: preserve-3d;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }

        .card.flipped .card-inner,
        .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-back {
            background: linear-gradient(135deg, var(--card-back), var(--primary-pink));
            color: white;
            font-size: 1.8rem;
        }

        .card-back:hover {
            background: linear-gradient(135deg, var(--card-back-hover), var(--dark-pink));
        }

        .card-front {
            background-color: var(--card-front);
            transform: rotateY(180deg);
            padding: 6px;
            border: 2px solid var(--card-border);
        }

        .card-front svg {
            width: 80%;
            height: 80%;
        }

        /* Modal de Victoria / Derrota */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 28, 20, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--modal-bg);
            color: var(--text-color);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal h2 {
            color: var(--dark-pink);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .modal p {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .modal button {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal button:hover {
            background-color: var(--dark-pink);
        }

        /* Responsive para móviles */
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
                align-items: center;
            }
            .side-panel {
                width: 100%;
                max-width: 520px;
                flex-direction: row;
                justify-content: space-around;
                padding: 12px;
            }
        }
    </style>
</head>

        const finalAttemptsEl = document.getElementById('finalAttempts');
        const modalRestartBtn = document.getElementById('modalRestartBtn');

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let attempts = 0;
        let isChecking = false;
        let timerInterval = null;
        let timeLeft = 0;

        function getDifficultySettings(pairs) {
            if (pairs == 6) {
                return { label: 'Fácil (12)', cols: 4, seconds: 45 };
            } else if (pairs == 8) {
                return { label: 'Normal (16)', cols: 4, seconds: 75 };
            } else {
                return { label: 'Difícil (20)', cols: 5, seconds: 110 };
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function startTimer() {
            stopTimer();
            const pairs = parseInt(difficultySlider.value);
            const settings = getDifficultySettings(pairs);
            timeLeft = settings.seconds;
            timerDisplay.textContent = formatTime(timeLeft);
            timerStatus.textContent = '¡A por todas!';

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = formatTime(timeLeft);

                if (timeLeft <= 15) {
                    timerStatus.textContent = '⚠️ ¡Corre!';
                }

                if (timeLeft <= 0) {
                    stopTimer();
                    // Tiempo agotado
                    const isGrinch = document.body.classList.contains('grinch-mode');
                    modalTitle.textContent = isGrinch ? '¡El Grinch robó el tiempo! ⏰' : '¡Se acabó el tiempo! ⌛';
                    modalText.innerHTML = `No pudiste terminar a tiempo. Inténtalo de nuevo.`;
                    gameModal.classList.add('active');
                }
            }, 1000);
        }

        function initGame() {
            stopTimer();
            gameBoard.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            attempts = 0;
            isChecking = false;
            attemptsEl.textContent = attempts;
            gameModal.classList.remove('active');

            const pairs = parseInt(difficultySlider.value);
            pairCountDisplay.textContent = `${pairs} parejas`;
            const settings = getDifficultySettings(pairs);
            difficultyLabel.textContent = settings.label;
            gameBoard.style.gridTemplateColumns = `repeat(${settings.cols}, 1fr)`;

            const isGrinch = document.body.classList.contains('grinch-mode');
            const pool = isGrinch ? grinchCharacters : pinkCharacters;

            const selectedChars = [...pool].sort(() => Math.random() - 0.5).slice(0, pairs);

            const deck = [...selectedChars, ...selectedChars]
                .sort(() => Math.random() - 0.5)
                .map((char, index) => ({
                    id: index,
                    name: char.name,
                    svg: char.svg,
                    isFlipped: false,
                    isMatched: false
                }));

            cards = deck;
            renderBoard();
            startTimer();
        }

        function renderBoard() {
            gameBoard.innerHTML = '';
            cards.forEach((card, index) => {
                const cardEl = document.createElement('button');
                cardEl.classList.add('card');
                if (card.isFlipped) cardEl.classList.add('flipped');
                if (card.isMatched) cardEl.classList.add('matched');
                cardEl.dataset.index = index;

                const isGrinch = document.body.classList.contains('grinch-mode');
                const backEmoji = isGrinch ? '🟢' : '🎄';

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back">${backEmoji}</div>
                        <div class="card-front">${card.svg}</div>
                    </div>
                `;

                cardEl.addEventListener('click', () => handleCardClick(index));
                gameBoard.appendChild(cardEl);
            });
        }

        function handleCardClick(index) {
            if (isChecking) return;
            const clickedCard = cards[index];

            if (clickedCard.isFlipped || clickedCard.isMatched) return;

            clickedCard.isFlipped = true;
            flippedCards.push({ index, name: clickedCard.name });
            renderBoard();

            if (flippedCards.length === 2) {
                attempts++;
                attemptsEl.textContent = attempts;
                isChecking = true;

                const [first, second] = flippedCards;

                if (first.name === second.name) {
                    cards[first.index].isMatched = true;
                    cards[second.index].isMatched = true;
                    matchedPairs++;
                    flippedCards = [];
                    isChecking = false;
                    renderBoard();

                    const targetPairs = parseInt(difficultySlider.value);
                    if (matchedPairs === targetPairs) {
                        stopTimer();
                        setTimeout(() => {
                            const isGrinch = document.body.classList.contains('grinch-mode');
                            modalTitle.textContent = isGrinch ? '¡Robo Navideño con éxito! 🟢' : '¡Feliz Navidad! 🎁';
                            modalText.innerHTML = `Has completado todas las parejas en <strong>${attempts}</strong> intentos y con <strong>${formatTime(timeLeft)}</strong> restante.`;
                            gameModal.classList.add('active');
                        }, 400);
                    }
                } else {
                    setTimeout(() => {
                        cards[first.index].isFlipped = false;
                        cards[second.index].isFlipped = false;
                        flippedCards = [];
                        isChecking = false;
                        renderBoard();
                    }, 900);
                }
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('grinch-mode');
            const isGrinch = document.body.classList.contains('grinch-mode');
            if (isGrinch) {
                themeToggleBtn.textContent = '💖 Rosita';
                gameTitle.textContent = '🟢 Memory del Grinch 🎄';
                timerIcon.textContent = '⏰';
            } else {
                themeToggleBtn.textContent = '💚 Grinch';
                gameTitle.textContent = '🎄 Memory Navideño ❄️';
                timerIcon.textContent = '⏳';
            }
            initGame();
        }

        restartBtn.addEventListener('click', initGame);
        modalRestartBtn.addEventListener('click', initGame);
        themeToggleBtn.addEventListener('click', toggleTheme);
        difficultySlider.addEventListener('input', initGame);

        // Iniciar juego al cargar
        initGame();
    </script>
</body>
</html>
